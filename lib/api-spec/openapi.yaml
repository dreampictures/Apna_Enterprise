openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Global Enterprise
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: Service applications
  - name: admin
    description: Admin authentication and dashboard
  - name: visitors
    description: Visitor tracking
  - name: payments
    description: Secure payment initiation and manual payment requests

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a service application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/ApplicationCreateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listApplications
      tags: [applications]
      summary: List all applications (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: query
          schema:
            type: string
          description: Filter by service type
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/receipt/{trackingNumber}:
    get:
      operationId: getApplicationReceipt
      tags: [applications]
      summary: Get a paid application receipt
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: Paid application receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Payment receipt is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/track/{trackingNumber}:
    get:
      operationId: trackApplication
      tags: [applications]
      summary: Track an application by its reference number
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: Application tracking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackApplicationResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/track/{trackingNumber}/payment:
    post:
      operationId: initiateApplicationPayment
      tags: [payments]
      summary: Initiate payment for an application using its stored amount
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: PayU payment fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPayment"
        "400":
          description: Payment cannot be initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/price:
    patch:
      operationId: setApplicationPrice
      tags: [applications]
      summary: Assign an application-specific service price (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetApplicationPriceBody"
      responses:
        "200":
          description: Application price saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPricingResponse"
        "400":
          description: Invalid price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}:
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                required: [success, id]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/export:
    get:
      operationId: exportApplicationsCsv
      tags: [applications]
      summary: Export applications as CSV (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests:
    post:
      operationId: createPaymentRequest
      tags: [payments]
      summary: Create a secure manual payment request (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequestBody"
      responses:
        "201":
          description: Manual payment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestCreateResponse"
        "400":
          description: Invalid payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [payments]
      summary: List application and manual payments (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unified payment records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests/{token}:
    get:
      operationId: getPaymentRequest
      tags: [payments]
      summary: Get a public manual payment request
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 64
      responses:
        "200":
          description: Manual payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequestPublic"
        "404":
          description: Payment request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests/{token}/payment:
    post:
      operationId: initiatePaymentRequestPayment
      tags: [payments]
      summary: Initiate a manual payment request through PayU
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 64
      responses:
        "200":
          description: PayU payment fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPayment"
        "400":
          description: Payment cannot be initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/dashboard:
    get:
      operationId: getDashboardStats
      tags: [admin]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/pricing:
    get:
      operationId: listServicePrices
      tags: [admin]
      summary: List service prices (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePriceList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/pricing/{service}:
    put:
      operationId: setServicePrice
      tags: [admin]
      summary: Set a service price (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: integer
                  minimum: 0
              required:
                - price
      responses:
        "200":
          description: Price saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePrice"
        "400":
          description: Invalid price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /visitors/track:
    post:
      operationId: trackVisitor
      tags: [visitors]
      summary: Increment visitor count
      responses:
        "200":
          description: Visit tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorCount"

  /visitors/count:
    get:
      operationId: getVisitorCount
      tags: [visitors]
      summary: Get total visitor count
      responses:
        "200":
          description: Visitor count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorCount"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CreateApplicationBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 10
          maxLength: 15
        email:
          type: string
          format: email
          maxLength: 254
        service:
          type: string
          enum:
            - Air Ticket Booking
            - Train Ticket Booking
            - Bus Ticket Booking
            - International Parcel Booking
            - PAN Card Apply
            - Aadhaar Card Services
            - Voter Card Apply
            - Passport Apply
            - Learning License
            - Driving License
            - UDID Certificate Apply
            - E-Shram Card
            - Schedule Caste Certificate
            - Punjab Resident Certificate
            - Income Certificate
            - UDYAM Certificate (MSME)
            - GST Registration
            - Job Application Forms (Govt Naukri)
            - College Admission Forms
            - School Admission Forms
            - Competitive Exam Forms
            - Scholarship Forms
            - General Online Form Filling
            - Document Scanning
            - Printing Services
            - Website Design Services
            - AEPS (Aadhaar Enabled Payment System)
            - Online Payments
            - Insurance Services
        message:
          type: string
          maxLength: 1000
        callbackRequested:
          type: boolean
        details:
          type: string
          maxLength: 12000
          description: JSON-encoded service-specific application details
      required:
        - name
        - phone
        - service

    Application:
      type: object
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        service:
          type: string
        message:
          type: string
          nullable: true
        status:
          type: string
        callbackRequested:
          type: boolean
        paymentStatus:
          type: string
        paymentAmount:
          type: number
          format: double
          nullable: true
        pricingType:
          type: string
        pricingStatus:
          type: string
        applicationPrice:
          type: number
          format: double
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        details:
          type: string
          maxLength: 12000
          description: JSON-encoded service-specific application details
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - trackingNumber
        - name
        - phone
        - service
        - status
        - callbackRequested
        - details
        - createdAt

    ApplicationReceipt:
      type: object
      properties:
        trackingNumber:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        service:
          type: string
        paymentAmount:
          type: number
          format: double
        paymentTxnId:
          type: string
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - trackingNumber
        - name
        - phone
        - service
        - paymentAmount
        - paymentTxnId
        - paidAt
        - createdAt

    PayUPaymentFields:
      type: object
      additionalProperties:
        type: string

    ApplicationPayment:
      type: object
      properties:
        required:
          type: boolean
        action:
          type: string
          format: uri
        fields:
          $ref: "#/components/schemas/PayUPaymentFields"
        amount:
          type: number
          format: double
        baseAmount:
          type: number
          format: double
        gatewayFee:
          type: number
          format: double
        gatewayFeeGst:
          type: number
          format: double
      required:
        - required
        - amount
        - baseAmount
        - gatewayFee
        - gatewayFeeGst

    ApplicationCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Application"
        - type: object
          properties:
            payment:
              $ref: "#/components/schemas/ApplicationPayment"

    ApplicationListResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        total:
          type: integer
      required:
        - applications
        - total

    TrackApplicationResponse:
      type: object
      properties:
        trackingNumber:
          type: string
        service:
          type: string
        status:
          type: string
        callbackRequested:
          type: boolean
        paymentStatus:
          type: string
        paymentAmount:
          type: number
          format: double
          nullable: true
        pricingType:
          type: string
        pricingStatus:
          type: string
        applicationPrice:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - trackingNumber
        - service
        - status
        - callbackRequested
        - createdAt

    SetApplicationPriceBody:
      type: object
      properties:
        price:
          type: number
          minimum: 0
          maximum: 100000000
        internalNotes:
          type: string
          maxLength: 5000
          nullable: true
      required:
        - price

    ApplicationPricingResponse:
      type: object
      properties:
        id:
          type: integer
        pricingType:
          type: string
        pricingStatus:
          type: string
        applicationPrice:
          type: number
          format: double
        paymentAmount:
          type: number
          format: double
        paymentStatus:
          type: string
        priceAssignedAt:
          type: string
          format: date-time
          nullable: true
        priceAssignedBy:
          type: string
          nullable: true
      required:
        - id
        - pricingType
        - pricingStatus
        - applicationPrice
        - paymentAmount
        - paymentStatus

    CreatePaymentRequestBody:
      type: object
      properties:
        service:
          type: string
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
        amount:
          type: number
          minimum: 1
          maximum: 100000000
        notes:
          type: string
          maxLength: 5000
          nullable: true
      required:
        - service
        - name
        - amount

    PaymentRequestPublic:
      type: object
      properties:
        token:
          type: string
        service:
          type: string
        name:
          type: string
        amount:
          type: number
        paymentStatus:
          type: string
        paidAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
        expired:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - token
        - service
        - name
        - amount
        - paymentStatus
        - expiresAt
        - expired
        - createdAt

    AdminPayment:
      type: object
      required: [id, source, reference, service, clientName, amount, paymentStatus, createdAt]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [application, manual]
        reference:
          type: string
        service:
          type: string
        clientName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        amount:
          type: number
        paymentStatus:
          type: string
        transactionId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminPaymentsResponse:
      type: object
      required: [payments]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/AdminPayment"

    PaymentRequestCreateResponse:
      allOf:
        - $ref: "#/components/schemas/PaymentRequestPublic"
        - type: object
          properties:
            paymentPageUrl:
              type: string
              format: uri
          required:
            - paymentPageUrl

    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AdminLoginResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
      required:
        - token
        - username

    DashboardStats:
      type: object
      properties:
        totalApplications:
          type: integer
        recentApplications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        applicationsByService:
          type: array
          items:
            $ref: "#/components/schemas/ServiceCount"
        visitorCount:
          type: integer
        totalLeads:
          type: integer
      required:
        - totalApplications
        - recentApplications
        - applicationsByService
        - visitorCount

    ServicePrice:
      type: object
      properties:
        service:
          type: string
        price:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
      required:
        - service
        - price
        - updatedAt

    ServicePriceList:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/ServicePrice"
      required:
        - prices

    ServiceCount:
      type: object
      properties:
        service:
          type: string
        count:
          type: integer
      required:
        - service
        - count

    VisitorCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
